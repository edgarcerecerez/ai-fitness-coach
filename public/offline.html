<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline | AI Fitness Coach</title>
    <meta name="theme-color" content="#2563eb" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
        color: #0f172a;
        text-align: center;
      }
      .badge {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #2563eb;
        font-weight: 600;
      }
      h1 {
        margin: 12px 0 8px;
        font-size: 24px;
      }
      p {
        max-width: 32ch;
        line-height: 1.5;
        color: #334155;
      }
      button {
        margin-top: 24px;
        background: #2563eb;
        color: #fff;
        border: 0;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: linear-gradient(180deg, #020617 0%, #0f172a 100%);
          color: #f8fafc;
        }
        p {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <span class="badge">AI Fitness Coach</span>
    <h1>You&rsquo;re offline</h1>
    <p>
      Looks like the network is unavailable. Reconnect to keep tracking your
      progress &mdash; your latest data will sync automatically.
    </p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </body>
</html>
